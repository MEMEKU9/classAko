<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="N2漢字">
<meta name="theme-color" content="#54565a">
<title>N2 漢字読み</title>
<style>
  :root{
    --silver:#d6d8da; --silver-d:#9a9da1; --silver-l:#ffffff;
    --frame:#b6b9bd;
    --bar-top:#6a6d72; --bar-bot:#3d3f43;
    --paper:#ffffff; --ink:#1a1a1a; --yomi:#5b5e63; --accent:#6f7378;
    --face:"Hiragino Sans","Noto Sans CJK JP","Microsoft YaHei",sans-serif;
    --mono:"Courier New",ui-monospace,monospace;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;background:#7d8488;font-family:var(--face);color:var(--ink);}
  .win{max-width:680px;margin:0 auto;min-height:100vh;background:var(--silver);
    border-left:2px solid var(--silver-l);border-top:2px solid var(--silver-l);
    border-right:2px solid var(--silver-d);border-bottom:2px solid var(--silver-d);}

  /* 标题栏：灰色金属渐变 + 顶部高光，Aqua 风但无蓝 */
  .titlebar{background:linear-gradient(180deg,var(--bar-top) 0%,#54565a 48%,var(--bar-bot) 100%);
    color:#fff;font-family:var(--mono);font-weight:bold;
    font-size:15px;padding:7px 11px;padding-top:calc(7px + env(safe-area-inset-top));display:flex;align-items:center;gap:8px;
    position:sticky;top:0;z-index:5;text-shadow:0 1px 1px rgba(0,0,0,.45);
    box-shadow:inset 0 1px 0 rgba(255,255,255,.45),inset 0 -1px 0 rgba(0,0,0,.3);}
  .titlebar .dot{width:13px;height:13px;border-radius:50%;
    background:radial-gradient(circle at 35% 30%,#ffffff 0%,#cfd2d6 40%,#8b8e92 100%);
    box-shadow:inset 0 1px 1px rgba(255,255,255,.8),0 1px 1px rgba(0,0,0,.35);}

  .bar{padding:8px;display:flex;flex-wrap:wrap;gap:8px;align-items:center;
    position:sticky;top:calc(32px + env(safe-area-inset-top));z-index:4;margin-top:-1px;
    background:rgba(245,246,248,.08);
    border-top:1px solid rgba(255,255,255,.6);
    border-bottom:1px solid rgba(150,150,150,.22);
    box-shadow:inset 0 1px 1px rgba(255,255,255,.8),
      inset 0 -6px 10px -6px rgba(255,255,255,.35),
      0 2px 6px rgba(0,0,0,.05);}
  /* 玻璃折射层：铺在按钮底下，带模糊 + SVG 边缘扭曲 */
  .bar::after{content:"";position:absolute;inset:0;z-index:-1;pointer-events:none;
    -webkit-backdrop-filter:blur(3px) saturate(140%);
    backdrop-filter:blur(3px) saturate(140%);
    filter:url(#glassWarp);}

  /* 扁胶囊水晶按钮：大圆角 + 顶部玻璃高光，小巧无色 */
  .btn{position:relative;font-family:var(--face);font-size:13px;font-weight:bold;
    padding:6px 15px;cursor:pointer;color:#3a3a3a;
    border:1px solid #a9acb0;border-radius:999px;
    background:linear-gradient(180deg,#ffffff 0%,#f1f2f4 48%,#e2e4e6 50%,#eef0f2 100%);
    box-shadow:inset 0 1px 0 rgba(255,255,255,.95),0 1px 2px rgba(0,0,0,.18);
    overflow:hidden;}
  /* 上半部那条玻璃反光 */
  .btn::before{content:"";position:absolute;left:8%;right:8%;top:1px;height:42%;
    border-radius:999px;background:linear-gradient(180deg,rgba(255,255,255,.95),rgba(255,255,255,0));
    pointer-events:none;}
  .btn:active{background:linear-gradient(180deg,#dfe1e3,#eef0f2);
    box-shadow:inset 0 1px 3px rgba(0,0,0,.22);}
  .btn.on{color:#fff;text-shadow:0 1px 1px rgba(0,0,0,.35);border-color:#6f7276;
    background:linear-gradient(180deg,#9a9da1 0%,#7c7f83 48%,#5e6165 50%,#6f7276 100%);
    box-shadow:inset 0 1px 0 rgba(255,255,255,.4),0 1px 2px rgba(0,0,0,.25);}
  .btn.on::before{background:linear-gradient(180deg,rgba(255,255,255,.55),rgba(255,255,255,0));}
  .count{font-family:var(--mono);font-size:13px;color:#444;margin-left:auto;}
  .sheet{padding:8px 10px 40px;}
  .group{margin:14px 0 4px;font-family:var(--mono);font-weight:bold;font-size:14px;
    color:#3d3f43;background:linear-gradient(180deg,#eceef0,#d9dbde);padding:5px 9px;
    border-radius:4px;border-bottom:1px solid var(--silver-d);
    box-shadow:inset 0 1px 0 rgba(255,255,255,.7);}

  /* 卡片：白纸 + 极淡玻璃高光，轻微圆角 */
  .card{background:linear-gradient(180deg,#ffffff,#f4f5f6);margin:6px 0;padding:11px 14px;
    border:1px solid #c3c6c9;border-radius:6px;
    box-shadow:inset 0 1px 0 rgba(255,255,255,.9),0 1px 2px rgba(0,0,0,.07);
    display:flex;align-items:center;justify-content:space-between;gap:14px;}
  .kanji{font-size:26px;font-weight:600;letter-spacing:1px;}
  .yomi{font-size:20px;color:var(--yomi);font-weight:bold;text-align:right;
    min-width:120px;letter-spacing:1px;}
  .hide-yomi .yomi{visibility:hidden;}
  .hide-yomi .card.revealed .yomi{visibility:visible;}
  .hint{font-family:var(--mono);font-size:12px;color:#555;padding:8px 10px;
    background:linear-gradient(180deg,#dcdee0,#cdd0d3);border-top:1px solid var(--silver-d);}
  .empty{padding:30px;text-align:center;font-family:var(--mono);color:#444;}
  .supp-rich{display:block !important;padding:11px 14px;}
  .supp-top{display:flex;align-items:center;justify-content:space-between;gap:14px;}
  .supp-right{display:flex;flex-direction:column;align-items:flex-end;gap:2px;}
  .supp-yomi{font-size:13px;color:var(--yomi);}
  .supp-meaning{font-size:16px;color:#1c5c8a;font-weight:bold;text-align:right;}
  .supp-ex{margin-top:7px;font-size:13px;color:#555;line-height:1.6;border-top:1px solid #e0e2e4;padding-top:6px;}
  .supp-tr{color:#888;font-size:12px;}
  body.mode-quiz #q, body.mode-quiz #toggle, body.mode-quiz #count{display:none;}
  body.mode-review #q, body.mode-review #count{display:none;}
  .quiz{display:none;padding:16px 14px 40px;}
  .quiz.active{display:block;}
  .review{display:none;padding:8px 10px 40px;}
  .review.active{display:block;}
  .score{font-family:var(--mono);font-size:14px;color:#3d3f43;margin-bottom:6px;}
  .qkanji{font-size:54px;font-weight:600;text-align:center;letter-spacing:3px;
    margin:8px 0 20px;background:linear-gradient(180deg,#ffffff,#eef0f1);padding:26px 10px;
    border:1px solid #c3c6c9;border-radius:8px;
    box-shadow:inset 0 1px 0 rgba(255,255,255,.9),0 1px 3px rgba(0,0,0,.08);}

  /* 选项：同款水晶质感，比按钮淡一点 */
  .opt{display:block;width:100%;text-align:left;font-size:21px;font-family:var(--face);
    padding:14px 16px;margin:8px 0;color:#1a1a1a;cursor:pointer;letter-spacing:1px;
    border:1px solid #c3c6c9;border-radius:7px;
    background:linear-gradient(180deg,#ffffff 0%,#f2f3f4 55%,#e7e8ea 100%);
    box-shadow:inset 0 1px 0 rgba(255,255,255,.9),0 1px 2px rgba(0,0,0,.08);}
  .opt:active{background:linear-gradient(180deg,#e2e3e5,#eef0f1);
    box-shadow:inset 0 1px 3px rgba(0,0,0,.2);}
  .opt.right{color:#fff;text-shadow:0 1px 1px rgba(0,0,0,.3);border-color:#1c7a44;
    background:linear-gradient(180deg,#36a55f 0%,#1f8a4c 100%);
    box-shadow:inset 0 1px 0 rgba(255,255,255,.4),0 1px 2px rgba(0,0,0,.2);}
  .opt.wrong{color:#fff;text-shadow:0 1px 1px rgba(0,0,0,.3);border-color:#8f2424;
    background:linear-gradient(180deg,#c44141 0%,#a82c2c 100%);
    box-shadow:inset 0 1px 0 rgba(255,255,255,.3),0 1px 2px rgba(0,0,0,.2);}
  .opt.locked{pointer-events:none;}
  .next{margin-top:16px;}
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <filter id="glassWarp" x="-20%" y="-20%" width="140%" height="140%">
    <feTurbulence type="fractalNoise" baseFrequency="0.012 0.018" numOctaves="2" seed="7" result="noise"/>
    <feDisplacementMap in="SourceGraphic" in2="noise" scale="9" xChannelSelector="R" yChannelSelector="G"/>
  </filter>
</svg>
<div class="win">
  <div class="titlebar"><span class="dot"></span>N2 漢字読み — memeku9.exe</div>
  <div class="bar">
    <button class="btn" id="toggle">隠す</button>
    <button class="btn" id="quizBtn">テスト</button>
    <button class="btn" id="reviewBtn">錯題</button>
    <button class="btn" id="suppBtn">補充</button>
  </div>
  <div class="sheet" id="sheet"></div>
  <div class="quiz" id="quiz"></div>
  <div class="review" id="review"></div>
  <div class="review" id="supp"></div>
  <div class="hint">点「隠す」盖住读音自测，点卡片单独翻开 · 睡前练正好</div>
</div>

摆上花，房间一下子就明亮起来。"],["騒がしい","さわがしい","吵闹的，喧闹的","隣（となり）の部屋（へや）が騒（さわ）がしくて、集中（しゅうちゅう）して勉強（べんきょう）できない。","隔壁房间太吵闹，无法集中学习。"]]};

var ORDER = ["名詞","動詞","副詞","補充"];
var sheet = document.getElementById("sheet");
var countEl = document.getElementById("count");
var toggleBtn = document.getElementById("toggle");

function build(filter){
  sheet.innerHTML = "";
  var total = 0;
  ORDER.forEach(function(g){
    var list = DATA[g];
    if(filter){ list = list.filter(function(w){ return (w[0]+w[1]).indexOf(filter) >= 0; }); }
    if(list.length === 0) return;
    total += list.length;
    var h = document.createElement("div"); h.className="group"; h.textContent = g + " (" + list.length + ")"; sheet.appendChild(h);
    list.forEach(function(w){
      var c = document.createElement("div"); c.className="card";
      if(w.length >= 5){
        c.className = "card supp-rich";
        c.innerHTML = '<div class="supp-top"><span class="kanji">' + w[0] + '</span><span class="supp-right">' + (w[0]!==w[1] ? '<span class="supp-yomi">' + w[1] + '</span>' : '') + '<span class="supp-meaning">' + w[2] + '</span></span></div><div class="supp-ex">' + w[3] + '<br><span class="supp-tr">' + w[4] + '</span></div>';
      } else {
        c.innerHTML = '<span class="kanji">' + w[0] + '</span><span class="yomi">' + w[1] + '</span>';
      }
      c.addEventListener("click", function(){ c.classList.toggle("revealed"); });
      sheet.appendChild(c);
    });
  });
  if(total === 0){ sheet.innerHTML = '<div class="empty">没有匹配的词</div>'; }
  if(countEl){ countEl.textContent = total + " 词"; }
}

toggleBtn.addEventListener("click", function(){
  var hidden = document.body.classList.toggle("hide-yomi");
  toggleBtn.classList.toggle("on", hidden);
  toggleBtn.textContent = hidden ? "見せる" : "隠す";
  var revealed = document.querySelectorAll(".card.revealed");
  for(var i=0;i<revealed.length;i++){ revealed[i].classList.remove("revealed"); }
});

var quizBtn = document.getElementById("quizBtn");
var reviewBtn = document.getElementById("reviewBtn");
var quiz = document.getElementById("quiz");
var review = document.getElementById("review");
var POOL = [];
ORDER.forEach(function(g){ DATA[g].forEach(function(w){ POOL.push(w); }); });
var ALLYOMI = POOL.map(function(w){ return w[1]; });
var score = 0, asked = 0;
var currentWord = null;
var WRONG = [];
var WRONG_KEY = "n2_wrong_v1";
function saveWrong(){
  try{ localStorage.setItem(WRONG_KEY, JSON.stringify(WRONG)); }catch(e){}
}
function loadWrong(){
  try{
    var raw = localStorage.getItem(WRONG_KEY);
    if(raw){ var arr = JSON.parse(raw); if(arr && arr.length){ WRONG = arr; } }
  }catch(e){}
}
loadWrong();
if(WRONG.length){ reviewBtn.textContent = "錯題(" + WRONG.length + ")"; }

function shuffle(a){ for(var i=a.length-1;i>0;i--){ var j=Math.floor(Math.random()*(i+1)); var t=a[i]; a[i]=a[j]; a[j]=t; } return a; }

function newQuestion(){
  var w = POOL[Math.floor(Math.random()*POOL.length)];
  currentWord = w;
  var correct = w[1];
  var opts = [correct], guard = 0;
  while(opts.length < 4 && guard < 300){
    var r = ALLYOMI[Math.floor(Math.random()*ALLYOMI.length)];
    if(opts.indexOf(r) < 0){ opts.push(r); }
    guard++;
  }
  shuffle(opts);
  var html = '<div class="score">正解 ' + score + ' / ' + asked + '</div>';
  html += '<div class="qkanji">' + w[0] + '</div>';
  opts.forEach(function(o){ html += '<button class="opt" data-y="' + o + '">' + o + '</button>'; });
  quiz.innerHTML = html;
  var btns = quiz.querySelectorAll(".opt");
  for(var i=0;i<btns.length;i++){ btns[i].addEventListener("click", function(){ answer(this, correct); }); }
}

function addWrong(w){
  if(!w) return;
  for(var i=0;i<WRONG.length;i++){ if(WRONG[i][0] === w[0]){ return; } }
  WRONG.push(w);
  saveWrong();
  reviewBtn.textContent = "錯題(" + WRONG.length + ")";
}

function answer(btn, correct){
  asked++;
  if(btn.getAttribute("data-y") === correct){ score++; } else { btn.classList.add("wrong"); addWrong(currentWord); }
  var btns = quiz.querySelectorAll(".opt");
  for(var i=0;i<btns.length;i++){
    btns[i].classList.add("locked");
    if(btns[i].getAttribute("data-y") === correct){ btns[i].classList.add("right"); }
  }
  var s = quiz.querySelector(".score");
  if(s){ s.textContent = '正解 ' + score + ' / ' + asked; }
  var nb = document.createElement("button");
  nb.className = "btn next"; nb.textContent = "次へ →";
  nb.addEventListener("click", newQuestion);
  quiz.appendChild(nb);
}

function renderReview(){
  review.innerHTML = "";
  if(WRONG.length === 0){
    review.innerHTML = '<div class="empty">还没有错题～去「テスト」做几道，做错的会自动收到这里</div>';
    return;
  }
  var head = document.createElement("div"); head.className = "group";
  head.textContent = "錯題 (" + WRONG.length + ")"; review.appendChild(head);
  WRONG.forEach(function(w){
    var c = document.createElement("div"); c.className = "card";
    if(w.length >= 5){
      c.className = "card supp-rich";
      c.innerHTML = '<div class="supp-top"><span class="kanji">' + w[0] + '</span><span class="supp-right">' + (w[0]!==w[1] ? '<span class="supp-yomi">' + w[1] + '</span>' : '') + '<span class="supp-meaning">' + w[2] + '</span></span></div><div class="supp-ex">' + w[3] + '<br><span class="supp-tr">' + w[4] + '</span></div>';
    } else {
      c.innerHTML = '<span class="kanji">' + w[0] + '</span><span class="yomi">' + w[1] + '</span>';
    }
    c.addEventListener("click", function(){ c.classList.toggle("revealed"); });
    review.appendChild(c);
  });
  var clr = document.createElement("button");
  clr.className = "btn next"; clr.textContent = "错题清空";
  clr.addEventListener("click", function(){ WRONG = []; saveWrong(); reviewBtn.textContent = "錯題"; renderReview(); });
  review.appendChild(clr);
}

function setMode(m){
  document.body.classList.remove("mode-quiz","mode-review","mode-supp","hide-yomi");
  toggleBtn.classList.remove("on"); toggleBtn.textContent = "隠す";
  sheet.style.display = "none";
  quiz.classList.remove("active"); review.classList.remove("active"); suppDiv.classList.remove("active"); suppBtn.classList.remove("on");
  quizBtn.classList.remove("on"); reviewBtn.classList.remove("on");
  quizBtn.textContent = "テスト";
  if(m === "quiz"){
    document.body.classList.add("mode-quiz");
    quiz.classList.add("active");
    quizBtn.classList.add("on"); quizBtn.textContent = "一覧";
    score = 0; asked = 0; newQuestion();
  } else if(m === "review"){
    document.body.classList.add("mode-review");
    review.classList.add("active");
    reviewBtn.classList.add("on");
    renderReview();
  } else if(m === "supp"){
    document.body.classList.add("mode-supp");
    suppDiv.classList.add("active");
    suppBtn.classList.add("on");
    renderSupp();
  } else {
    sheet.style.display = "";
    build();
  }
}

quizBtn.addEventListener("click", function(){
  if(document.body.classList.contains("mode-quiz")){ setMode("list"); } else { setMode("quiz"); }
});
reviewBtn.addEventListener("click", function(){
  if(document.body.classList.contains("mode-review")){ setMode("list"); } else { setMode("review"); }
});

var suppBtn = document.getElementById("suppBtn");
var suppDiv = document.getElementById("supp");
var SUPP_POOL = DATA["補充"];
var SUPP_ALLYOMI = SUPP_POOL.map(function(w){ return w[1]; });

function renderSupp(){
  suppDiv.innerHTML = "";
  var head = document.createElement("div"); head.className = "group";
  head.textContent = "補充 (" + SUPP_POOL.length + " 词)";
  suppDiv.appendChild(head);
  SUPP_POOL.forEach(function(w){
    var c = document.createElement("div");
    if(w.length >= 4){
      c.className = "card supp-rich";
      c.innerHTML = '<div class="supp-top"><span class="kanji">' + w[0] + '</span><span class="supp-right">' + (w[0]!==w[1] ? '<span class="supp-yomi">' + w[1] + '</span>' : '') + '<span class="supp-meaning">' + w[2] + '</span></span></div><div class="supp-ex">' + w[3] + (w[4] ? '<br><span class="supp-tr">' + w[4] + '</span>' : '') + '</div>';
    } else {
      c.className = "card revealed";
      c.innerHTML = '<span class="kanji">' + w[0] + '</span><span class="yomi">' + w[1] + '</span>';
    }
    suppDiv.appendChild(c);
  });
}

suppBtn.addEventListener("click", function(){
  if(document.body.classList.contains("mode-supp")){ setMode("list"); } else { setMode("supp"); }
});


setMode("list");
</script>
</body>
</html>
