<!doctype html>
<html lang="zh-CN">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>AKOMUN Ubu TV Test</title>
<style>
*{box-sizing:border-box}
body{
  margin:0;
  min-height:100vh;
  background:#050505;
  color:#eee;
  font-family:Arial,sans-serif;
}
.app{
  width:min(430px,100vw);
  margin:auto;
  min-height:100vh;
  padding:22px 18px 40px;
}
h1{margin:0;font-size:30px;letter-spacing:2px}
.sub{color:#888;margin:4px 0 22px}
.tv{
  width:100%;
  padding:22px;
  border:1px solid #333;
  background:#151515;
  border-radius:40px 40px 18px 18px;
  box-shadow:0 0 50px rgba(255,255,255,.06);
}
.screen{
  width:100%;
  aspect-ratio:16/9;
  background:#000;
  border:2px solid #555;
  overflow:hidden;
}
video, iframe{
  width:100%;
  height:100%;
  border:0;
  display:block;
  background:#000;
}
.ctrl{
  display:flex;
  align-items:center;
  gap:10px;
  margin-top:12px;
}
.light{width:12px;height:12px;background:#ddd;border-radius:2px}
.label{color:#aaa;font-size:13px}
.stand{
  width:40%;
  height:45px;
  margin:0 auto;
  border-left:40px solid transparent;
  border-right:40px solid transparent;
  border-top:45px solid #333;
}
.base{width:55%;height:8px;background:#333;margin:0 auto 28px}
.panel{
  border:1px solid #333;
  background:#101010;
  padding:16px;
  margin-top:18px;
}
button,a{
  width:100%;
  display:block;
  margin-top:10px;
  padding:14px;
  text-align:center;
  background:#181818;
  border:1px solid #444;
  color:#fff;
  text-decoration:none;
  font-size:15px;
}
.note{color:#999;font-size:12px;line-height:1.55;margin-top:12px}
.hidden{display:none}
</style>

<div class="app">
  <h1>AKOMUN</h1>
  <div class="sub">UbuWeb 小电视嵌入测试</div>

  <div class="tv">
    <div class="screen" id="screen">
      <video id="video" controls playsinline preload="metadata" src="https://ubuweb.com/media/video/fluxfilm_25_landow.mp4"></video>
    </div>
    <div class="ctrl">
      <div class="light"></div>
      <div class="label">TV-UBU / direct video</div>
    </div>
  </div>
  <div class="stand"></div>
  <div class="base"></div>

  <div class="panel">
    <strong>George Landow - The Evil Faerie</strong>
    <div class="note">默认测试：直接把 UbuWeb mp4 放进 AKOMUN 小电视。</div>

    <button onclick="useVideo()">测试 A：直接 video 播放</button>
    <button onclick="useIframe()">测试 B：iframe 嵌入原网页</button>
    <a href="https://ubuweb.com/film/fluxfilm23_landow.html" target="_blank">外部打开 UbuWeb 页面</a>

    <div class="note">
      如果 A 能播，正式版电影模块就可以把真实视频地址放进小电视。<br>
      如果 A 不行但 B 行，就用 iframe。<br>
      如果 B 也不行，就只能外部打开。
    </div>
  </div>
</div>

<script>
function useVideo(){
  document.querySelector("#screen").innerHTML =
    `<video controls playsinline preload="metadata" src="https://ubuweb.com/media/video/fluxfilm_25_landow.mp4"></video>`;
}
function useIframe(){
  document.querySelector("#screen").innerHTML =
    `<iframe src="https://ubuweb.com/film/fluxfilm23_landow.html" allowfullscreen></iframe>`;
}
</script>
</html>
