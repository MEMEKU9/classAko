<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>N2 完形填空</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { width:100%; height:100%; overflow:hidden; font-family:'MS UI Gothic','ヒラギノ角ゴ Pro','Hiragino Kaku Gothic Pro',Osaka,Tahoma,sans-serif; background:#e0e0e0; }
.screen { width:100vw; height:100vh; height:100dvh; display:flex; flex-direction:column; overflow:hidden; background:#e8e8e8; }
.taskbar { background:linear-gradient(180deg,#c8c8cc 0%,#a8a8b0 100%); border-bottom:1px solid #888890; padding:0 6px; display:flex; align-items:flex-end; gap:2px; flex-shrink:0; padding-top:env(safe-area-inset-top,0px); }
.tab-btn { background:#d8d8dc; border:1px solid #888890; border-bottom:none; border-radius:4px 4px 0 0; padding:4px 14px; font-size:12.1px; color:#333340; cursor:pointer; font-family:inherit; line-height:18px; }
.tab-btn.active { background:#e8e8e8; color:#0a0a14; font-weight:bold; border-bottom:1px solid #e8e8e8; margin-bottom:-1px; z-index:1; }
.tab-spacer { flex:1; }
.status-icons { display:flex; gap:4px; align-items:center; padding-bottom:4px; }
.status-icon { width:14px; height:14px; border:1px solid #555560; border-radius:2px; display:inline-flex; align-items:center; justify-content:center; font-size:7.7px; color:#333340; background:#d0d0d8; }
.menubar { background:linear-gradient(180deg,#d0d0d4 0%,#b8b8bc 100%); border-bottom:1px solid #888890; padding:2px 8px; display:flex; align-items:center; gap:10px; font-size:12.1px; color:#1a1a2a; flex-shrink:0; }
.menu-item { cursor:pointer; padding:1px 4px; border-radius:2px; }
.menu-item:hover { background:#8888aa; color:#fff; }
.menu-sep { flex:1; }
.menu-right { font-size:11px; color:#44445a; }
.page { display:none; flex:1; flex-direction:column; overflow:hidden; min-height:0; }
.page.visible { display:flex; }

/* GRAMMAR */
.grammar-list-header { background:linear-gradient(180deg,#b0b0b8 0%,#909098 100%); padding:4px 8px; font-size:11px; color:#fff; border-bottom:1px solid #606068; display:flex; justify-content:space-between; flex-shrink:0; }
.grammar-list { flex:1; overflow-y:auto; background:#e8e8e8; -webkit-overflow-scrolling:touch; }
.grammar-list::-webkit-scrollbar { width:8px; }
.grammar-list::-webkit-scrollbar-track { background:#c8c8cc; }
.grammar-list::-webkit-scrollbar-thumb { background:#888890; border-radius:2px; }
.grammar-row { display:flex; align-items:center; padding:8px 10px; border-bottom:1px solid #cccccc; cursor:pointer; gap:8px; background:#e8e8e8; }
.grammar-row:active { background:#c8c8cc; }
.grammar-row.selected { background:#3a3a5a; color:#fff; }
.grammar-row.selected .grammar-tag { color:#aaaacc; background:#5a5a7a; border-color:#7a7a9a; }
.grammar-icon { width:20px; height:20px; border:1px solid #888890; border-radius:3px; background:#d8d8e0; flex-shrink:0; display:flex; align-items:center; justify-content:center; font-size:11px; color:#333340; }
.grammar-name { font-size:13.2px; font-weight:bold; flex:1; color:#0a0a14; }
.grammar-row.selected .grammar-name { color:#fff; }
.grammar-tag { font-size:9.9px; color:#44445a; background:#d0d0d8; border:1px solid #9090a0; border-radius:2px; padding:1px 5px; white-space:nowrap; }
.grammar-detail { background:#f0f0f0; border-top:1px solid #c8c8d0; border-bottom:2px solid #7070a0; padding:8px 10px; -webkit-overflow-scrolling:touch; }
.detail-title { font-size:15.4px; font-weight:bold; color:#0a0a14; border-bottom:1px solid #b0b0b8; padding-bottom:4px; margin-bottom:5px; }
.detail-body { font-size:13.2px; color:#1a1a2a; line-height:1.7; }
.detail-example { margin-top:5px; background:#e0e0e8; border-left:3px solid #7070a0; padding:4px 7px; font-size:13.2px; color:#0a0a14; line-height:1.6; }
.detail-source { font-size:11px; color:#6666aa; margin-top:3px; }
.detail-empty { color:#888890; font-size:13.2px; font-style:italic; padding-top:12px; text-align:center; }

/* QUIZ */
.quiz-content { flex:1; overflow-y:auto; padding:8px 10px; background:#e8e8e8; -webkit-overflow-scrolling:touch; min-height:0; }
.quiz-content::-webkit-scrollbar { width:8px; }
.quiz-content::-webkit-scrollbar-track { background:#c8c8cc; }
.quiz-content::-webkit-scrollbar-thumb { background:#888890; border-radius:2px; }
.quiz-progress-bar { background:#b8b8c0; height:5px; border-radius:2px; margin-bottom:7px; }
.quiz-progress-fill { background:#4a4a7a; height:100%; border-radius:2px; transition:width 0.3s; }
.quiz-meta { font-size:11px; color:#44445a; margin-bottom:7px; display:flex; justify-content:space-between; }
.quiz-source { font-size:9.9px; color:#888890; margin-bottom:4px; }
.quiz-passage { background:#f0f0f0; border:1px solid #b0b0b8; border-radius:3px; padding:8px 10px; font-size:14.3px; line-height:2.1; color:#0a0a14; margin-bottom:8px; }
.blank-slot { display:inline-block; border-bottom:1px solid #3a3a5a; min-width:60px; text-align:center; font-weight:bold; color:#2a2a6a; background:#d8d8f0; padding:0 4px; border-radius:2px; font-size:13.2px; }
.blank-slot.answered-correct { color:#1a4a1a; background:#c8e8c8; border-color:#2a6a2a; }
.blank-slot.answered-wrong { color:#6a1a1a; background:#ecc8c8; border-color:#8a2a2a; text-decoration:line-through; }
.choices-grid { display:grid; grid-template-columns:1fr 1fr; gap:6px; margin-bottom:8px; }
.choice-btn { background:linear-gradient(180deg,#e0e0e4 0%,#c8c8cc 100%); border:1px solid #888890; border-radius:4px; padding:8px 8px; font-size:13.2px; color:#0a0a14; cursor:pointer; text-align:left; font-family:inherit; line-height:1.4; box-shadow:1px 1px 0 #9090a0; -webkit-tap-highlight-color:transparent; }
.choice-btn:active { background:#a0a0a8; box-shadow:none; transform:translate(1px,1px); }
.choice-btn.correct { background:#90cc90; border-color:#2a6a2a; color:#0a2a0a; font-weight:bold; box-shadow:1px 1px 0 #1a5a1a; }
.choice-btn.wrong { background:#cc7070; border-color:#6a1a1a; color:#fff; box-shadow:1px 1px 0 #4a0a0a; }
.choice-btn.disabled { cursor:default; }
.choice-label { display:inline-block; width:14px; font-weight:bold; color:#44445a; font-size:11px; }
.choice-btn.correct .choice-label, .choice-btn.wrong .choice-label { color:inherit; }
.feedback-box { background:#f0ede8; border:1px solid #a09888; border-radius:3px; padding:8px 10px; margin-bottom:8px; display:none; }
.feedback-box.visible { display:block; }
.feedback-header { font-size:13.2px; font-weight:bold; margin-bottom:5px; }
.feedback-correct .feedback-header { color:#1a4a1a; }
.feedback-wrong .feedback-header { color:#6a1a1a; }
.feedback-grammar-name { font-size:12.1px; color:#3a2a0a; background:#e0d8c8; border:1px solid #a09878; border-radius:2px; padding:1px 6px; display:inline-block; margin-bottom:4px; }
.feedback-explanation { font-size:12.1px; color:#2a1a0a; line-height:1.6; margin-bottom:6px; }
.feedback-grammar-link { display:inline-block; background:linear-gradient(180deg,#a0a0c0 0%,#7878a0 100%); border:1px solid #4a4a7a; border-radius:3px; padding:4px 12px; font-size:12.1px; color:#fff; cursor:pointer; font-family:inherit; box-shadow:1px 1px 0 #3a3a5a; -webkit-tap-highlight-color:transparent; }
.feedback-grammar-link:active { box-shadow:none; transform:translate(1px,1px); }
.quiz-nav { display:flex; gap:6px; padding:6px 10px; background:#d0d0d4; border-top:1px solid #909098; flex-shrink:0; padding-bottom:max(6px,env(safe-area-inset-bottom)); }
.nav-btn { background:linear-gradient(180deg,#b0b0c0 0%,#8888a0 100%); border:1px solid #5a5a7a; border-radius:4px; padding:6px 14px; font-size:13.2px; color:#fff; cursor:pointer; font-family:inherit; box-shadow:1px 1px 0 #4a4a6a; -webkit-tap-highlight-color:transparent; }
.nav-btn:active { box-shadow:none; transform:translate(1px,1px); }
.nav-btn.primary { background:linear-gradient(180deg,#6a6a9a 0%,#4a4a7a 100%); border-color:#2a2a5a; box-shadow:1px 1px 0 #1a1a3a; }
.score-screen { flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center; padding:16px; gap:10px; }
.score-title { font-size:14.3px; font-weight:bold; color:#0a0a14; }
.score-number { font-size:39.6px; font-weight:bold; color:#2a2a6a; font-family:'Courier New',monospace; border:2px solid #6a6a9a; border-radius:4px; padding:8px 20px; background:#e0e0f0; box-shadow:2px 2px 0 #4a4a7a; }
.score-detail { font-size:12.1px; color:#44445a; text-align:center; }
.score-miss-list { background:#f0f0f0; border:1px solid #b0b0b8; border-radius:3px; padding:6px 10px; width:100%; font-size:12.1px; color:#1a1a2a; max-height:40vh; overflow-y:auto; }
.score-miss-item { padding:4px 0; border-bottom:1px dotted #b0b0b8; display:flex; justify-content:space-between; align-items:center; gap:8px; }
.score-miss-item:last-child { border-bottom:none; }
.score-miss-link { color:#4a4a7a; cursor:pointer; font-size:11px; white-space:nowrap; }
</style>
</head>
<body>
<div class="screen">
  <div class="taskbar">
    <button class="tab-btn" id="tab-grammar" onclick="switchPage('grammar')">語法</button>
    <button class="tab-btn active" id="tab-quiz" onclick="switchPage('quiz')">答題</button>
    <div class="tab-spacer"></div>
    <div class="status-icons">
      <span class="status-icon">G</span>
      <span class="status-icon">✉</span>
      <span class="status-icon">⚡</span>
    </div>
  </div>
  <div class="menubar">
    <span class="menu-item">Applications</span>
    <span class="menu-item">View</span>
    <div class="menu-sep"></div>
    <div class="menu-right"><span id="menu-info">N2 完形填空</span></div>
  </div>
  <div class="page" id="page-grammar">
    <div class="grammar-list-header">
      <span>語法条目</span><span id="grammar-count"></span>
    </div>
    <div class="grammar-list" id="grammar-list-body"></div>
  </div>
  <div class="page visible" id="page-quiz">
    <div class="quiz-content" id="quiz-content"></div>
    <div class="quiz-nav" id="quiz-nav"></div>
  </div>
</div>

<script>
var GRAMMAR = [
  { id:"g01", name:"〜でしょう（論説開篇）", tag:"推測/文体", source:"2025.12 Q48",
    meaning:"论说文开篇用「〜という人も多いでしょう」这个形式，以委婉推测的语气陈述普遍现象，是固定句式。",
    structure:"普通形＋でしょう",
    notes:"不要与「とします」（假定推导）混淆。とします是「もし〜だとします」这种中间论证用法，不用于开篇陈述现象。",
    examples:[{jp:"色使いや盛り方など、料理の見た目がきれいだと食事の楽しみが増すという人も多いでしょう。",zh:"色彩搭配和摆盘等让料理好看的话，应该有很多人会觉得更享受进食吧。"}] },
  { id:"g02", name:"〜にまで", tag:"取り立て助詞", source:"2025.12 Q50",
    meaning:"「甚至延伸到……的范围/程度」。标记意外地扩展到某个极限范围的语感。",
    structure:"名詞＋にまで＋動詞",
    notes:"与「にのみ」（只对……）、「に限らず」（不限于……）区别。にまで专门强调范围扩展到了极限边界。",
    examples:[{jp:"目から入る情報は、食べたときの味の感じ方にまで影響していたのです。",zh:"从眼睛获取的信息，甚至影响到了吃东西时对味道的感受方式。"}] },
  { id:"g03", name:"〜に利用されている（被動）", tag:"受け身", source:"2025.7 Q48",
    meaning:"「Nに＋Vられる」被动句式，に标记动作发出者，客观陈述谁在使用/受益于某项服务。",
    structure:"N（対象）に＋Vられる",
    notes:"不要与「てくれる」（对方为我方做某事）混淆。てくれる需要授受关系和恩惠语感，而这里是客观说明文，没有这层语境。",
    examples:[{jp:"車の運転が困難な人や、最寄りのバス停や駅まで歩くことが負担になる人に利用されている。",zh:"被驾驶有困难的人，以及步行到最近的公交站或车站有负担的人所使用着。"}] },
  { id:"g04", name:"〜少なくないという", tag:"語篇逻辑", source:"2025.7 Q49",
    meaning:"「そのため＋对策」前面需要「问题依然存在」的状态。如果填「少なくなったのだ」（已经减少了），问题已解决，后文的对策就失去了理由，逻辑矛盾。",
    structure:"普通形＋という（引用/转述语气）",
    notes:"★核心框架第5条：そのため/だから前的「问题状态」不能是已解决/已减少的状态，否则与后文对策逻辑矛盾。",
    examples:[{jp:"用事がないから外出しないという高齢者は少なくないという。そのため、商店街での割引を実施したり……",zh:"据说据调查，没有事情所以不外出的老年人为数不少。正因如此，实施了商业街打折等……"}] },
  { id:"g05", name:"実は", tag:"談話連接", source:"2023.12 Q48",
    meaning:"揭示表面现象背后的真正原因。「看起来奇怪→実は＋真正原因」是经典用法。",
    structure:"（表面現象の記述）→ 実は＋（真の原因）",
    notes:"「一方で」（并列对比）、「しかも」（递进追加）与実は的功能不同——実は専用于揭示原因。",
    examples:[{jp:"実は、温泉は入り方を間違えると体に負担をかけてしまうのです。",zh:"其实，温泉如果泡法搞错了，反而会给身体造成负担。"}] },
  { id:"g06", name:"〜ようにしてください", tag:"呼応副詞", source:"2023.12 Q49",
    meaning:"「必ず」是预告强语气指令/建议的呼应副词。固定组合：必ず→ようにしてください/てください/命令形。",
    structure:"必ず＋Vようにしてください",
    notes:"「のでしょう」（推测）、「つもりです」（陈述自己的打算）都与必ず的确定指令语感矛盾，直接排除。",
    examples:[{jp:"お湯に入る前は必ず「かけ湯」をするようにしてください。",zh:"进入浴池之前，务必要做「冲身」（先用温泉水冲洗身体）。"}] },
  { id:"g07", name:"〜こともある", tag:"可能性", source:"2023.12 Q50",
    meaning:"「有这种情况存在（但不绝对）」。ですから前需要「有可能性」的陈述，才能合理引出「视情况而定」的建议。",
    structure:"Vこともある",
    notes:"「と思います」（主观推测）不适合说明文的客观陈述。「にあります」是「問題は〜にある」这个句型专用，这里没有对应主语结构，不通顺。",
    examples:[{jp:"温泉の成分が肌に負担をかけることもあります。ですから、刺激の強い酸性の温泉に入ったときは……",zh:"温泉成分有时也会给皮肤造成负担。所以，当泡了刺激性强的酸性温泉时……"}] },
  { id:"g08", name:"せっかく〜のに＋てしまっては", tag:"呼応表現", source:"2023.12 Q51",
    meaning:"「せっかく〜のに」后接「Vてしまっては＋もったいない/困る」固定呼応组合，表达事与愿违的惋惜。",
    structure:"せっかく〜のに、Vてしまっては＋もったいない",
    notes:"「疲れてしまったのが」把前面名词化，是已发生的事实陈述，没有假设性惋惜感。「疲れてしまうばかりで」描述持续反复状态，后面通常接递进的负面后果，不会直接接もったいない这种一次性评价。",
    examples:[{jp:"せっかく疲れをとりに温泉に行ったのに、疲れてしまってはもったいないですよね。",zh:"明明特意去温泉消除疲劳，结果反而累了那真是太可惜了呢。"}] },
  { id:"g09", name:"〜とされている", tag:"客観評価", source:"2023.7 Q49",
    meaning:"「被（社会普遍）认为/视为……」，される是する的被动形，加持续态ている，表达持续存在的社会共识/客观评价。",
    structure:"〜と＋される＋ている",
    notes:"同组句式：〜と考えられている / 〜と言われている。遇到空格前是「〜と」、需要收尾时优先考虑这组。「しておきます」是事先准备的语感（主动安排），与客观评价状态的语境不符。",
    examples:[{jp:"人工的に生産できないため、大変貴重なものとされています。",zh:"因为无法人工生产，所以被视为极其珍贵的东西。"}] },
  { id:"g10", name:"〜てきました（変化蓄積）", tag:"てくる/ていく", source:"2022.12 Q48",
    meaning:"「てくる」表示从过去某时间点持续到现在，逐渐积累/变化，方向朝当下靠拢。搭配「近年来」等回顾性语境。",
    structure:"V＋てきた（てきました）",
    notes:"「ていく」是从现在出发朝未来发展，方向相反。「増えそうでした」是「过去观察到快要发生（但还没发生）」的意思，而报告增多是已成事实，不适合用样态推测。",
    examples:[{jp:"座りすぎがさまざまな体の不調の原因になるという研究報告も増えてきました。",zh:"关于久坐是各种身体不适原因的研究报告也逐渐多了起来。"}] },
  { id:"g11", name:"ところが", tag:"逆接", source:"2022.12 Q49 / 2021.12 Q49",
    meaning:"逆接连词，专门制造「前面是常识性预期→后面是意外反转的真相」的强烈反差。常与実は搭配出现。",
    structure:"（常识性预期）→ ところが、実は〜",
    notes:"「というのは」（理由说明）、「したがって」（顺接因果）、「しかも」（递进追加）都没有逆转功能，遇到「预期与现实反转」的语境直接排除这三个。",
    examples:[{jp:"座っている姿勢は体にあまり負担がかかっていないと思うかもしれません。ところが、実は立っているときの2倍もの負担が腰にかかるのだそうです。",zh:"也许你会觉得坐着的姿势不怎么会给身体造成负担。然而，实际上腰部承受的负担据说竟是站立时的2倍。"}] },
  { id:"g12", name:"〜である（論説断定）", tag:"文体", source:"2022.7 Q48",
    meaning:"书面语的客观断定助动词。论说文开篇定义议题时的标准用法，表示确定性陈述，不带推测或转述语气。",
    structure:"名詞・形容詞語幹＋である",
    notes:"「だろう」（推测）不适合明确的主题定义。「とのことだ」（转述引用他人说法）不适合作者自己定义本文议题——这是自己在说，不是在引用别人。",
    examples:[{jp:"今回取り上げるのは、自転車の問題である。",zh:"这次要谈的是自行车（停放）的问题。"}] },
  { id:"g13", name:"〜するために（目的→手段）", tag:"目的", source:"2022.7 Q51",
    meaning:"「为了……」，標準的目的→手段逻辑链。前面讲目標，後面緊跟具体手段。",
    structure:"動詞辞書形＋ために",
    notes:"「しても」是让步逆接（即使……也……），与目的→手段的顺接关系不符。「なったように」过去时态与「今后的手段说明」面向未来的语境不搭，时态和语义都不通顺。",
    examples:[{jp:"より快適で安全な街にするために、全自動式の地下駐輪場の設置は有効な手段の一つだといえる。",zh:"为了建成更舒适安全的街道，可以说全自动式地下停车场的设置是有效手段之一。"}] },
  { id:"g14", name:"そこで（問題→対策）", tag:"談話連接", source:"2021.7 Q49",
    meaning:"「于是/正因如此（针对这个问题采取行动）」。专用于「面对这个状况，于是（主体）主动做了某件事」的语境。",
    structure:"（问题状况）→ そこで、（主体主动做某件事）",
    notes:"そのため偏客观因果（因为这个原因产生了这个结果），そこで偏主动应对（面对这个状况于是……采取行动）。「たとえば」是举例，「ところが」是逆接，都与「问题→主动对策」的顺接关系不符。",

// ══════ DISTRACTOR ENGINE ══════
function getChoices(q) {
  var allAnswers = QUESTIONS.map(function(x){ return x.answer; });
  var pool = allAnswers.filter(function(a){ return a !== q.answer; });
  // shuffle pool
  for(var i=pool.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=pool[i];pool[i]=pool[j];pool[j]=t;}
  var distractors = pool.slice(0,3);
  var choices = [q.answer].concat(distractors);
  // shuffle choices
  for(var i=choices.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=choices[i];choices[i]=choices[j];choices[j]=t;}
  return choices;
}

// store generated choices per question (so they don't re-shuffle on re-render)
var choiceCache = {};
function getChoicesCached(q) {
  if(!choiceCache[q.id]) choiceCache[q.id] = getChoices(q);
  return choiceCache[q.id];
}

// ══════ STATE ══════
var currentPage='quiz', currentQ=0, answers={}, selectedGrammar=null, quizDone=false;

function switchPage(p) {
  currentPage=p;
  document.getElementById('page-grammar').classList.toggle('visible',p==='grammar');
  document.getElementById('page-quiz').classList.toggle('visible',p==='quiz');
  document.getElementById('tab-grammar').classList.toggle('active',p==='grammar');
  document.getElementById('tab-quiz').classList.toggle('active',p==='quiz');
  document.getElementById('menu-info').textContent=p==='grammar'?'語法一覧':'N2 完形填空';
  if(p==='grammar') renderGrammarList();
}

// ══════ GRAMMAR PAGE ══════
function buildDetailHTML(g) {
  var exHtml=g.examples.map(function(e){
    return '<div class="detail-example">'+e.jp+'<br><span style="color:#4a4a6a;">→ '+e.zh+'</span></div>';
  }).join('');
  return '<div class="grammar-detail">'+
    '<div class="detail-title">'+g.name+' <span style="font-size:11px;font-weight:normal;color:#44445a;">'+g.tag+'</span></div>'+
    '<div class="detail-body"><b>意味：</b>'+g.meaning+'<br><b>接続：</b><span style="font-family:monospace;font-size:12px;">'+g.structure+'</span>'+(g.notes?'<br><b>注意：</b><span style="color:#5a3a0a;">'+g.notes+'</span>':'')+'</div>'+
    exHtml+
    '<div class="detail-source" style="margin-top:5px;">出典：'+g.source+'</div>'+
    '</div>';
}

function renderGrammarList() {
  document.getElementById('grammar-count').textContent=GRAMMAR.length+'件';
  var body=document.getElementById('grammar-list-body');
  body.innerHTML='';
  GRAMMAR.forEach(function(g){
    var wrap=document.createElement('div');
    var row=document.createElement('div');
    row.className='grammar-row'+(selectedGrammar===g.id?' selected':'');
    row.onclick=function(){selectGrammar(g.id);};
    row.innerHTML='<div class="grammar-icon">文</div><div class="grammar-name">'+g.name+'</div><div class="grammar-tag">'+g.tag+'</div>';
    wrap.appendChild(row);
    if(selectedGrammar===g.id){
      var det=document.createElement('div');
      det.innerHTML=buildDetailHTML(g);
      wrap.appendChild(det.firstChild);
    }
    body.appendChild(wrap);
  });
}

function selectGrammar(id) {
  selectedGrammar = (selectedGrammar===id) ? null : id;
  renderGrammarList();
  if(selectedGrammar){
    // scroll the opened row into view
    var body=document.getElementById('grammar-list-body');
    var rows=body.querySelectorAll('.grammar-row.selected');
    if(rows[0]) setTimeout(function(){ rows[0].scrollIntoView({block:'nearest',behavior:'smooth'}); },50);
  }
}

// ══════ QUIZ PAGE ══════
function renderQuiz() {
  if(quizDone){renderScore();return;}
  var q=QUESTIONS[currentQ];
  var choices=getChoicesCached(q);
  var answerIdx=choices.indexOf(q.answer);
  var answered=answers[q.id]!==undefined;
  var userIdx=answers[q.id];
  var correct=userIdx===answerIdx;

  var blankDisplay=answered?(correct?q.answer:q.answer):'　　　';
  var blankCls='blank-slot'+(answered?(correct?' answered-correct':' answered-wrong'):'');
  var passageHtml=q.passage.replace('【　】','<span class="'+blankCls+'">'+blankDisplay+'</span>');
  if(answered&&!correct){
    passageHtml=q.passage.replace('【　】','<span class="blank-slot answered-wrong">'+choices[userIdx]+'</span>');
  }

  var labels=['A','B','C','D'];
  var choicesHtml='<div class="choices-grid">';
  choices.forEach(function(c,i){
    var cls='choice-btn'+(answered?' disabled':'');
    if(answered){if(i===answerIdx)cls+=' correct';else if(i===userIdx)cls+=' wrong';}
    var oc=answered?'':'onclick="submitAnswer('+i+')"';
    choicesHtml+='<button class="'+cls+'" '+oc+'><span class="choice-label">'+labels[i]+'.</span> '+c+'</button>';
  });
  choicesHtml+='</div>';

  var g=GRAMMAR.find(function(x){return x.id===q.grammarId;});
  var feedbackHtml='';
  if(answered){
    var fbClass=correct?'feedback-correct':'feedback-wrong';
    var fbIcon=correct?'✓ 正解！':'✗ 不正解';
    feedbackHtml='<div class="feedback-box visible '+fbClass+'">'+
      '<div class="feedback-header">'+fbIcon+'</div>'+
      '<div class="feedback-grammar-name">'+(g?g.name:'')+' — '+(g?g.tag:'')+'</div>'+
      '<div class="feedback-explanation">'+q.explanation+'</div>'+
      '<button class="feedback-grammar-link" onclick="goToGrammar(\''+q.grammarId+'\')">→ 語法ページで確認</button>'+
      '</div>';
  }

  var pct=Math.round((currentQ/QUESTIONS.length)*100);
  var content=document.getElementById('quiz-content');
  content.innerHTML=
    '<div class="quiz-progress-bar"><div class="quiz-progress-fill" style="width:'+pct+'%"></div></div>'+
    '<div class="quiz-meta"><span>問題 '+(currentQ+1)+' / '+QUESTIONS.length+'</span><span>正解: '+countCorrect()+'</span></div>'+
    '<div class="quiz-source">出典：'+q.source+'</div>'+
    '<div class="quiz-passage">'+passageHtml+'</div>'+
    choicesHtml+feedbackHtml;
  content.scrollTop=0;

  var nav=document.getElementById('quiz-nav');
  nav.innerHTML='';
  if(currentQ>0){var pb=document.createElement('button');pb.className='nav-btn';pb.textContent='◀ 前へ';pb.onclick=function(){currentQ--;renderQuiz();};nav.appendChild(pb);}
  var sp=document.createElement('span');sp.style.flex='1';nav.appendChild(sp);
  if(answered){
    if(currentQ<QUESTIONS.length-1){var nb=document.createElement('button');nb.className='nav-btn primary';nb.textContent='次へ ▶';nb.onclick=function(){currentQ++;renderQuiz();};nav.appendChild(nb);}
    else{var db=document.createElement('button');db.className='nav-btn primary';db.textContent='結果を見る';db.onclick=function(){quizDone=true;renderScore();};nav.appendChild(db);}
  }
}

function submitAnswer(idx){
  var q=QUESTIONS[currentQ];answers[q.id]=idx;renderQuiz();
  document.getElementById('quiz-content').scrollTop=0;
}

function countCorrect(){
  var n=0;
  QUESTIONS.forEach(function(q){
    var choices=getChoicesCached(q);
    var ansIdx=choices.indexOf(q.answer);
    if(answers[q.id]===ansIdx)n++;
  });
  return n;
}

function renderScore(){
  var correct=countCorrect(),total=QUESTIONS.length,pct=Math.round(correct/total*100);
  var missHtml='';
  QUESTIONS.forEach(function(q){
    var choices=getChoicesCached(q);
    var ansIdx=choices.indexOf(q.answer);
    if(answers[q.id]!==ansIdx){
      var g=GRAMMAR.find(function(x){return x.id===q.grammarId;});
      missHtml+='<div class="score-miss-item">'+
        '<span>'+q.source+'：正解「'+q.answer+'」</span>'+
        '<span class="score-miss-link" onclick="goToGrammar(\''+q.grammarId+'\')">'+(g?g.name:'')+'→</span>'+
        '</div>';
    }
  });
  var content=document.getElementById('quiz-content');
  content.innerHTML='<div class="score-screen">'+
    '<div class="score-title">── 結果 ──</div>'+
    '<div class="score-number">'+correct+' / '+total+'</div>'+
    '<div class="score-detail">'+pct+'% 正解率</div>'+
    (missHtml?'<div class="score-miss-list"><div style="font-size:10px;font-weight:bold;color:#2a2a3a;margin-bottom:4px;">間違えた問題：</div>'+missHtml+'</div>':'<div style="font-size:13px;color:#1a3a1a;font-weight:bold;">全問正解！</div>')+
    '</div>';
  var nav=document.getElementById('quiz-nav');nav.innerHTML='';
  var rb=document.createElement('button');rb.className='nav-btn primary';rb.style.flex='1';rb.textContent='もう一度';
  rb.onclick=function(){answers={};choiceCache={};currentQ=0;quizDone=false;renderQuiz();};nav.appendChild(rb);
}

function goToGrammar(id){
  selectedGrammar=id;
  switchPage('grammar');
  renderGrammarList();
  setTimeout(function(){
    var body=document.getElementById('grammar-list-body');
    var sel=body.querySelector('.grammar-row.selected');
    if(sel) sel.scrollIntoView({block:'nearest',behavior:'smooth'});
  },50);
}

renderQuiz();renderGrammarList();
</script>
