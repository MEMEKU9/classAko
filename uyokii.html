<h1>Uyoki 纯净阅读书签</h1>
<p>不经过 Render。书签在开心漫当前页面里自动滚到底，边滚边复制大尺寸 Blob 图片，再建立只有漫画的黑色阅读页。</p>
<button id="copy" type="button">复制书签代码</button>
<ol>
<li>在 Safari 随便收藏一个网页。</li>
<li>打开书签列表，长按该书签并选择“编辑”。</li>
<li>名称改成 <code>Uyoki 净化</code>，删除原地址，粘贴刚复制的代码并保存。</li>
<li>打开漫画章节，等第一张正文出现后，从书签中点击 <code>Uyoki 净化</code>。</li>
</ol>
<p class="note">它不固定抓一张或五张，而是持续滚动并记录所有符合正文尺寸的 Blob/Canvas 图片。运行期间不要手动滚动。</p>
<textarea id="code" readonly></textarea>
