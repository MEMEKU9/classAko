<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
  <meta name="theme-color" content="#000000">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Uyoki">
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="icon" href="./icon.svg" type="image/svg+xml">
  <title>Uyoki</title>
  <style>
    :root{
      color-scheme:dark;
      --safe-top:env(safe-area-inset-top,0px);
      --safe-bottom:env(safe-area-inset-bottom,0px);
      --bar-h:56px;
      --line:#262626;
      --muted:#8b8b8b;
    }
    *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
    html,body{
      width:100%;height:100%;margin:0;overflow:hidden;
      background:#000;color:#fff;
      font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","PingFang SC","Segoe UI",sans-serif
    }
    button,a{font:inherit}
    .topbar{
      position:fixed;z-index:30;inset:0 0 auto;
      height:calc(var(--bar-h) + var(--safe-top));
      padding:var(--safe-top) 12px 0;
      display:flex;align-items:center;gap:10px;
      background:rgba(0,0,0,.94);
      border-bottom:1px solid var(--line);
      -webkit-backdrop-filter:blur(18px);
      backdrop-filter:blur(18px)
    }
    .brand{
      flex:0 0 auto;font-size:15px;font-weight:750;letter-spacing:.04em
    }
    .chapter{
      min-width:0;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
      color:#c8c8c8;font-size:12px
    }
    .square{
      appearance:none;flex:0 0 auto;height:36px;min-width:58px;padding:0 11px;
      border:1px solid #fff;border-radius:0;background:#000;color:#fff;
      display:inline-flex;align-items:center;justify-content:center;
      font-size:12px;font-weight:650
    }
    .square:active{background:#fff;color:#000}
    .viewer{
      position:fixed;
      top:calc(var(--bar-h) + var(--safe-top));
      right:0;bottom:calc(46px + var(--safe-bottom));left:0;
      background:#000
    }
    iframe{display:block;width:100%;height:100%;border:0;background:#000}
    .loading{
      position:absolute;z-index:12;inset:0;display:grid;place-items:center;
      padding:28px;background:#000;text-align:center;transition:opacity .2s ease
    }
    .loading.hidden{opacity:0;pointer-events:none}
    .loading h1{margin:0 0 10px;font-size:15px}
    .loading p{max-width:340px;margin:0;color:var(--muted);font-size:12px;line-height:1.7}
    .loading .open{margin-top:18px}
    .bottom{
      position:fixed;z-index:30;inset:auto 0 0;
      min-height:calc(46px + var(--safe-bottom));
      padding:0 12px var(--safe-bottom);
      display:flex;align-items:center;justify-content:space-between;gap:12px;
      border-top:1px solid var(--line);background:rgba(0,0,0,.94);
      -webkit-backdrop-filter:blur(18px);backdrop-filter:blur(18px)
    }
    .status{
      min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
      color:var(--muted);font-size:11px
    }
    .open-current{
      appearance:none;border:0;background:transparent;color:#fff;
      padding:8px 0;font-size:12px;font-weight:650;white-space:nowrap
    }
    .sheet-wrap{
      position:fixed;z-index:60;inset:0;display:none;align-items:flex-end;
      background:rgba(0,0,0,.55)
    }
    .sheet-wrap.show{display:flex}
    .sheet{
      width:100%;padding:18px 14px calc(14px + var(--safe-bottom));
      background:#0b0b0b;border-top:1px solid #333
    }
    .sheet-title{margin:0 0 14px;font-size:14px;font-weight:700}
    .sheet-button{
      width:100%;min-height:52px;padding:0 14px;margin:0 0 10px;
      border:1px solid #333;border-radius:0;background:#111;color:#fff;
      text-align:left;font-size:13px
    }
    .sheet-button:active{background:#fff;color:#000}
    .sheet-note{margin:10px 2px 0;color:#777;font-size:11px;line-height:1.6}
  </style>
</head>
<body>
  <header class="topbar">
    <div class="brand">Uyoki</div>
    <div id="chapterLabel" class="chapter">001 第一案上　扉页这家伙是谁</div>
    <button id="chapterButton" class="square" type="button">章节</button>
  </header>

  <main class="viewer">
    <div id="loading" class="loading">
      <div>
        <h1 id="loadingTitle">正在打开第一章</h1>
        <p id="loadingText">正在尝试在 Uyoki 中显示开心漫官方页面。若 Safari 阻止网页嵌入，可点击下方按钮直接打开。</p>
        <button id="loadingOpen" class="square open" type="button">打开官方页</button>
      </div>
    </div>

    <iframe
      id="readerFrame"
      title="Uyoki 漫画阅读页"
      src="https://www.kaixinman.com/chapter/yDZ9AHqBVY"
      referrerpolicy="strict-origin-when-cross-origin"
      allow="fullscreen"
    ></iframe>
  </main>

  <footer class="bottom">
    <div id="status" class="status">《开封奇谈－这个包公不太行》</div>
    <button id="openCurrent" class="open-current" type="button">在 Safari 打开 ↗</button>
  </footer>

  <div id="sheetWrap" class="sheet-wrap" role="dialog" aria-modal="true">
    <section class="sheet">
      <h2 class="sheet-title">章节跳转</h2>
      <button id="firstChapter" class="sheet-button" type="button">001　第一案上　扉页这家伙是谁</button>
      <button id="directory" class="sheet-button" type="button">打开完整章节目录</button>
      <button id="closeSheet" class="sheet-button" type="button">取消</button>
      <p class="sheet-note">Safari 版不能向开心漫网页注入 APK 的纯净阅读脚本，因此这里显示的是官方网页；不会错误抓取其他漫画封面。</p>
    </section>
  </div>

  <script>
    const FIRST_CHAPTER = "https://www.kaixinman.com/chapter/yDZ9AHqBVY";
    const DIRECTORY = "https://www.kaixinman.com/comic/9OpwE8gdGP";

    const frame = document.getElementById("readerFrame");
    const loading = document.getElementById("loading");
    const loadingTitle = document.getElementById("loadingTitle");
    const loadingText = document.getElementById("loadingText");
    const chapterLabel = document.getElementById("chapterLabel");
    const status = document.getElementById("status");
    const sheetWrap = document.getElementById("sheetWrap");

    let currentUrl = FIRST_CHAPTER;
    let currentMode = "chapter";
    let loadTimer;

    function openExternal(){
      window.location.href = currentUrl;
    }

    function showLoading(title, text){
      loadingTitle.textContent = title;
      loadingText.textContent = text;
      loading.classList.remove("hidden");
      clearTimeout(loadTimer);
      loadTimer = window.setTimeout(() => {
        loadingTitle.textContent = "Safari 可能阻止了内嵌显示";
        loadingText.textContent = "链接本身没有改变。点击“打开官方页”即可在当前页面直接阅读。";
      }, 7000);
    }

    function load(url, label, mode){
      currentUrl = url;
      currentMode = mode;
      chapterLabel.textContent = label;
      status.textContent = mode === "chapter"
        ? "《开封奇谈－这个包公不太行》"
        : "开心漫完整章节目录";
      showLoading(
        mode === "chapter" ? "正在打开第一章" : "正在打开章节目录",
        "正在尝试在 Uyoki 中显示开心漫官方页面。若 Safari 阻止网页嵌入，可点击下方按钮直接打开。"
      );
      frame.src = url;
      sheetWrap.classList.remove("show");
    }

    frame.addEventListener("load", () => {
      clearTimeout(loadTimer);
      window.setTimeout(() => loading.classList.add("hidden"), 550);
    });

    document.getElementById("chapterButton").addEventListener("click", () => {
      sheetWrap.classList.add("show");
    });
    document.getElementById("closeSheet").addEventListener("click", () => {
      sheetWrap.classList.remove("show");
    });
    sheetWrap.addEventListener("click", event => {
      if (event.target === sheetWrap) sheetWrap.classList.remove("show");
    });

    document.getElementById("firstChapter").addEventListener("click", () => {
      load(FIRST_CHAPTER, "001 第一案上　扉页这家伙是谁", "chapter");
    });
    document.getElementById("directory").addEventListener("click", () => {
      load(DIRECTORY, "选择章节", "directory");
    });
    document.getElementById("openCurrent").addEventListener("click", openExternal);
    document.getElementById("loadingOpen").addEventListener("click", openExternal);

    if ("serviceWorker" in navigator && location.protocol.startsWith("http")) {
      navigator.serviceWorker.register("./sw.js").catch(() => {});
    }
  </script>
</body>
</html>
