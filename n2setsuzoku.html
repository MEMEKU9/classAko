<style>
:root{
  --silver:#d6d8da;--silver-d:#9a9da1;--silver-l:#ffffff;

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{margin:0;padding:0;background:#7d8488;font-family:var(--face);color:var(--ink);}
.win{max-width:680px;margin:0 auto;min-height:100vh;background:var(--silver);
  border-left:2px solid var(--silver-l);border-top:2px solid var(--silver-l);
  border-right:2px solid var(--silver-d);border-bottom:2px solid var(--silver-d);}
.titlebar{background:linear-gradient(180deg,var(--bar-top) 0%,#54565a 48%,var(--bar-bot) 100%);
  color:#fff;font-family:var(--mono);font-weight:bold;font-size:15px;
  padding:7px 11px;padding-top:calc(7px + env(safe-area-inset-top));
  display:flex;align-items:center;gap:8px;position:sticky;top:0;z-index:10;
  text-shadow:0 1px 1px rgba(0,0,0,.45);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.45),inset 0 -1px 0 rgba(0,0,0,.3);}
.titlebar .dot{width:13px;height:13px;border-radius:50%;flex-shrink:0;
  background:radial-gradient(circle at 35% 30%,#fff 0%,#cfd2d6 40%,#8b8e92 100%);
  box-shadow:inset 0 1px 1px rgba(255,255,255,.8),0 1px 1px rgba(0,0,0,.35);}
/* TABS */
.tabs{display:flex;overflow-x:auto;gap:3px;padding:7px 8px 0;
  background:linear-gradient(180deg,#c8cacc,#b8bbbe);
  border-bottom:2px solid var(--silver-d);
  position:sticky;top:calc(34px + env(safe-area-inset-top));z-index:9;
  scrollbar-width:none;}
.tabs::-webkit-scrollbar{display:none;}
.tab{flex-shrink:0;font-family:var(--face);font-size:12px;font-weight:bold;
  padding:5px 11px;cursor:pointer;color:#444;
  border:1px solid #a9acb0;border-bottom:none;border-radius:5px 5px 0 0;
  background:linear-gradient(180deg,#e8eaec,#d4d6d8);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.7);white-space:nowrap;}
.tab.on{color:#1a1a1a;background:var(--silver);border-color:#8a8d90;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.9),0 -1px 3px rgba(0,0,0,.06);
  position:relative;z-index:2;}
/* TOOLBAR */
.bar{padding:7px 8px;display:flex;flex-wrap:wrap;gap:7px;align-items:center;
  background:linear-gradient(180deg,rgba(255,255,255,.12),rgba(200,202,204,.08));
  border-bottom:1px solid rgba(150,150,150,.22);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.6),0 1px 4px rgba(0,0,0,.04);}
.btn{position:relative;font-family:var(--face);font-size:13px;font-weight:bold;
  padding:5px 14px;cursor:pointer;color:#3a3a3a;
  border:1px solid #a9acb0;border-radius:999px;
  background:linear-gradient(180deg,#fff 0%,#f1f2f4 48%,#e2e4e6 50%,#eef0f2 100%);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.95),0 1px 2px rgba(0,0,0,.18);
  overflow:hidden;}
.btn::before{content:"";position:absolute;left:8%;right:8%;top:1px;height:42%;
  border-radius:999px;background:linear-gradient(180deg,rgba(255,255,255,.95),rgba(255,255,255,0));
  pointer-events:none;}
.btn:active{background:linear-gradient(180deg,#dfe1e3,#eef0f2);box-shadow:inset 0 1px 3px rgba(0,0,0,.22);}
.btn.on{color:#fff;text-shadow:0 1px 1px rgba(0,0,0,.35);border-color:#6f7276;
  background:linear-gradient(180deg,#9a9da1 0%,#7c7f83 48%,#5e6165 50%,#6f7276 100%);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.4),0 1px 2px rgba(0,0,0,.25);}
.btn.on::before{background:linear-gradient(180deg,rgba(255,255,255,.55),rgba(255,255,255,0));}
/* SHEET */
.sheet{padding:10px 10px 48px;}
.cat-label{font-family:var(--mono);font-weight:bold;font-size:13px;
  color:#3d3f43;background:linear-gradient(180deg,#eceef0,#d9dbde);
  padding:5px 10px;border-radius:4px;margin:14px 0 5px;
  border-bottom:1px solid var(--silver-d);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.7);}
.cat-desc{font-size:12px;color:#555;padding:4px 10px 8px;line-height:1.5;
  background:linear-gradient(180deg,rgba(255,255,255,.5),rgba(240,241,243,.5));
  border-left:3px solid #b0b3b7;border-radius:0 4px 4px 0;margin-bottom:6px;}
.gcard{background:linear-gradient(180deg,#fff,#f4f5f6);
  margin:6px 0;border:1px solid #c3c6c9;border-radius:7px;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.9),0 1px 2px rgba(0,0,0,.07);
  overflow:hidden;cursor:pointer;}
.gcard-head{display:flex;align-items:center;gap:10px;padding:11px 14px;}
.gcard-form{font-size:19px;font-weight:700;letter-spacing:.5px;color:#1a1a1a;flex:1;}
.gcard-mean{font-size:13px;color:#3d5a80;font-weight:bold;text-align:right;min-width:80px;}
.gcard-ex{display:none;padding:0 14px 11px;border-top:1px solid #dcdfe2;
  background:linear-gradient(180deg,#f7f8f9,#f1f2f4);}
.gcard-ex .ja{font-size:14px;color:#1a1a1a;margin-top:8px;line-height:1.6;}
.gcard-ex .zh{font-size:12px;color:#5b5e63;margin-top:4px;line-height:1.5;}
.gcard-ex .conn{display:inline-block;background:#e8eaec;border:1px solid #c3c6c9;
  border-radius:3px;font-size:11px;font-family:var(--mono);
  padding:1px 6px;margin-bottom:6px;color:#444;}
.gcard.open .gcard-ex{display:block;}
.gcard.open .gcard-head{border-bottom:1px solid #dcdfe2;}
.gcard-head::after{content:"▶";font-size:10px;color:#aaa;transition:transform .15s;}
.gcard.open .gcard-head::after{transform:rotate(90deg);}
/* GRAMMAR QUIZ */
.quiz{display:none;padding:12px 10px 48px;}
.quiz.active{display:block;}
.qscore{font-family:var(--mono);font-size:12px;color:#3d3f43;margin-bottom:8px;}
.qbox{background:linear-gradient(180deg,#fff,#eef0f1);border:1px solid #c3c6c9;

.qform{font-size:26px;font-weight:700;letter-spacing:.5px;}
.qmean{font-size:13px;color:#5b5e63;margin-top:5px;}

.opt.locked{pointer-events:none;}

.sortquiz.active{display:block;}

  border:1px solid #c3c6c9;border-radius:7px;padding:8px;margin-bottom:8px;

.slot-item{font-size:14px;padding:6px 11px;border-radius:5px;cursor:pointer;

.sq-opt{font-size:14px;padding:7px 13px;border-radius:5px;cursor:pointer;

.sq-opt:active{background:linear-gradient(180deg,#dfe1e3,#eef0f1);}
.sq-opt.used{opacity:.3;pointer-events:none;}
.sq-actions{display:flex;gap:8px;margin-bottom:10px;}
.sq-result{display:none;margin-top:10px;border-radius:8px;overflow:hidden;border:1px solid #c3c6c9;}
.sq-result.show{display:block;}
.sq-result-head{padding:10px 14px;font-weight:bold;font-size:14px;}
.sq-result-head.ok{background:linear-gradient(180deg,#36a55f,#1f8a4c);color:#fff;}
.sq-result-head.ng{background:linear-gradient(180deg,#c44141,#a82c2c);color:#fff;}
.sq-correct{padding:10px 14px;font-size:13px;background:linear-gradient(180deg,#f0f8f3,#e5f2ea);
  border-top:1px solid #c3d8ca;color:#1a4a28;line-height:1.7;}
.sq-grammar{padding:10px 14px;background:linear-gradient(180deg,#f7f8f9,#eef0f2);
  border-top:1px solid #dcdfe2;}
.sq-grammar-title{font-family:var(--mono);font-size:11px;color:#888;margin-bottom:6px;}
.sq-rule{font-size:12px;color:#2a3a50;margin:5px 0;padding:5px 10px;
  background:linear-gradient(180deg,#e8f0f8,#dce8f5);

.sq-rule-link{display:inline-block;margin-top:4px;font-size:11px;font-family:var(--mono);

.sq-next{margin-top:10px;}
.hint{font-family:var(--mono);font-size:11px;color:#555;padding:7px 10px;
  background:linear-gradient(180deg,#dcdee0,#cdd0d3);border-top:1px solid var(--silver-d);}
.empty{padding:28px;text-align:center;font-family:var(--mono);color:#444;font-size:13px;}
.badge{display:inline-block;font-size:10px;font-family:var(--mono);
  padding:1px 6px;border-radius:3px;margin-left:6px;vertical-align:middle;
  background:#e0e2e5;border:1px solid #b0b3b7;color:#444;}
</style>
</head>

/* ─── TABS & MODE ─── */
var tabsEl = document.getElementById("tabs");
var toolbarEl = document.getElementById("toolbar");
var sheetEl = document.getElementById("sheet");
var quizEl = document.getElementById("quiz");
var sortEl = document.getElementById("sortquiz");
var hintEl = document.getElementById("hint");

var currentMode = "list";
var currentCat = GRAMDATA[0].id;

/* Build tabs */
var tabDefs = [{id:"all",label:"全部"}].concat(GRAMDATA.map(function(d){return {id:d.id,label:d.short};})).concat([{id:"_sort",label:"★並べ替え"}]);
tabDefs.forEach(function(td){
  var t = document.createElement("div");
  t.className = "tab"; t.textContent = td.label; t.dataset.id = td.id;
  t.addEventListener("click", function(){
    if(td.id === "_sort"){ startSort(); }
    else { showList(td.id); }
  });
  tabsEl.appendChild(t);
});

function setTabActive(id){
  tabsEl.querySelectorAll(".tab").forEach(function(t){ t.classList.toggle("on", t.dataset.id === id); });
}

/* Build toolbar */
function buildToolbar(mode){
  toolbarEl.innerHTML = "";
  if(mode === "list"){
    var b = makeBtn("接続テスト", function(){ startGramQuiz(); });
    toolbarEl.appendChild(b);
  } else if(mode === "gramquiz"){
    var b = makeBtn("一覧へ戻る", function(){ showList(currentCat); });
    toolbarEl.appendChild(b);
  } else if(mode === "sort"){
    var b1 = makeBtn("一覧へ戻る", function(){ showList(currentCat); });
    var b2 = makeBtn("次の問題", function(){ nextSort(); }); b2.id="sq-next-btn";
    toolbarEl.appendChild(b1);
    toolbarEl.appendChild(b2);
  }
}
function makeBtn(label, fn){
  var b = document.createElement("button"); b.className = "btn"; b.textContent = label;
  b.addEventListener("click", fn); return b;
}

/* ─── LIST VIEW ─── */
function renderCat(cat){
  var h = "";
  h += "<div class='cat-label' id='sec-" + cat.id + "'>" + cat.short + "（" + cat.label + "）</div>";
  h += "<div class='cat-desc'>" + cat.desc + "</div>";
  cat.items.forEach(function(it, idx){
    var eid = cat.id + "_" + idx;
    h += "<div class='gcard' id='" + eid + "'>";
    h += "<div class='gcard-head'><span class='gcard-form'>" + it.form + "</span><span class='gcard-mean'>" + it.mean + "</span></div>";
    h += "<div class='gcard-ex'><span class='conn'>" + it.conn + "</span><div class='ja'>" + it.ja + "</div><div class='zh'>" + it.zh + "</div></div>";
    h += "</div>";
  });
  return h;
}

function showList(id, scrollTo){
  currentMode = "list"; currentCat = (id === "all") ? GRAMDATA[0].id : id;
  setTabActive(id);
  buildToolbar("list");
  sheetEl.style.display = ""; quizEl.classList.remove("active"); sortEl.classList.remove("active");
  hintEl.textContent = "タップで例文展開 · 接続テスト / 並べ替えで練習";
  var h = "";
  if(id === "all"){ GRAMDATA.forEach(function(c){ h += renderCat(c); }); }
  else { GRAMDATA.forEach(function(c){ if(c.id === id) h += renderCat(c); }); }
  sheetEl.innerHTML = h;
  sheetEl.querySelectorAll(".gcard").forEach(function(card){
    card.addEventListener("click", function(){ card.classList.toggle("open"); });
  });
  if(scrollTo){
    setTimeout(function(){
      var el = document.getElementById("sec-" + scrollTo);
      if(el) el.scrollIntoView({behavior:"smooth", block:"start"});
    }, 80);
  }
}

/* ─── GRAMMAR QUIZ ─── */
var gScore = 0, gAsked = 0;
var GPOOL = [];
function buildGPool(){
  GPOOL = [];
  GRAMDATA.forEach(function(cat){ cat.items.forEach(function(it){ GPOOL.push({cat:cat.label, item:it}); }); });
  shuffle(GPOOL);
}
var gQi = 0;
function startGramQuiz(){
  currentMode = "gramquiz";
  buildToolbar("gramquiz");
  sheetEl.style.display = "none"; quizEl.classList.add("active"); sortEl.classList.remove("active");
  hintEl.textContent = "語法点を見て接続形を4択で答える";
  gScore = 0; gAsked = 0; buildGPool(); gQi = 0;
  newGramQ();
}
function allConns(){ var r=[]; GRAMDATA.forEach(function(c){ c.items.forEach(function(it){ if(r.indexOf(it.conn)<0) r.push(it.conn); }); }); return r; }
function newGramQ(){
  if(gQi >= GPOOL.length){ gQi=0; shuffle(GPOOL); }
  var cur = GPOOL[gQi++];
  var correct = cur.item.conn;
  var conns = allConns();
  var opts = [correct]; var guard=0;
  while(opts.length<4 && guard<200){ var r=conns[Math.floor(Math.random()*conns.length)]; if(opts.indexOf(r)<0) opts.push(r); guard++; }
  shuffle(opts);
  var h = "<div class='qscore'>正解 " + gScore + " / " + gAsked + "</div>";
  h += "<div class='qbox'><div class='qform'>" + cur.item.form + "</div><div class='qmean'>" + cur.item.mean + "  ／ " + cur.cat + "</div></div>";
  opts.forEach(function(o){ var sv=o.replace(/\x27/g,"&#39;"); h += "<button class='opt' data-v='" + sv + "'>" + o + "</button>"; });
  quizEl.innerHTML = h;
  quizEl.querySelectorAll(".opt").forEach(function(btn){
    btn.addEventListener("click", function(){ gramAnswer(btn, correct); });
  });
}
function gramAnswer(btn, correct){
  gAsked++;
  if(btn.getAttribute("data-v")===correct){ gScore++; btn.classList.add("right"); }
  else { btn.classList.add("wrong"); }
  quizEl.querySelectorAll(".opt").forEach(function(b){
    b.classList.add("locked");
    if(b.getAttribute("data-v")===correct) b.classList.add("right");
  });
  var s=quizEl.querySelector(".qscore"); if(s) s.textContent="正解 "+gScore+" / "+gAsked;
  var nw=document.createElement("button"); nw.className="btn"; nw.style.marginTop="12px"; nw.textContent="次へ →";
  nw.addEventListener("click", newGramQ);
  quizEl.appendChild(nw);
}

/* ─── SORT QUIZ ─── */
var sqPool = []; var sqIdx = 0;
var sqSelected = [];
var sqLocked = false;

function shuffle(a){ for(var i=a.length-1;i>0;i--){ var j=Math.floor(Math.random()*(i+1)); var t=a[i];a[i]=a[j];a[j]=t; } return a; }

function startSort(){
  currentMode = "sort";
  setTabActive("_sort");
  buildToolbar("sort");
  sheetEl.style.display="none"; quizEl.classList.remove("active"); sortEl.classList.add("active");
  hintEl.textContent = "选项按正确顺序点击 · 点已选项可撤回";
  sqPool = QDATA.slice(); shuffle(sqPool); sqIdx = 0;
  renderSort();
}

function nextSort(){
  sqIdx++;
  if(sqIdx >= sqPool.length){ sqIdx=0; shuffle(sqPool); }
  renderSort();
}

function renderSort(){
  sqSelected = []; sqLocked = false;
  var q = sqPool[sqIdx];
  var opts = q.opts.slice();
  var shuffled = opts.slice(); shuffle(shuffled);

  var h = "<div class='sq-header'><span style='font-family:var(--mono);font-size:11px;color:#888;'>" + q.year + "</span><span>问题 " + (sqIdx+1) + " / " + sqPool.length + "</span></div>";
  h += "<div class='sq-stem'>" + q.stem + "</div>";
  h += "<div class='sq-slots' id='sq-slots'></div>";
  h += "<div class='sq-opts' id='sq-opts'>";
  shuffled.forEach(function(o, i){
    var idx = opts.indexOf(o);
    h += '<div class="sq-opt" data-optidx="' + idx + '" data-label="' + o + '">' + o + '</div>';
  });
  h += "</div>";
  h += "<div class='sq-actions'>";
  h += "<button class='btn' id='sq-check'>確認</button>";
  h += "<button class='btn' id='sq-reset'>リセット</button>";
  h += "</div>";
  h += "<div class='sq-result' id='sq-result'></div>";
  sortEl.innerHTML = h;

  sortEl.querySelectorAll(".sq-opt").forEach(function(el){
    el.addEventListener("click", function(){
      if(sqLocked) return;
      if(el.classList.contains("used")) return;
      var idx = parseInt(el.dataset.optidx);
      sqSelected.push(idx);
      el.classList.add("used");
      renderSlots(q.opts);
    });
  });

  document.getElementById("sq-check").addEventListener("click", function(){ checkSort(q); });
  document.getElementById("sq-reset").addEventListener("click", function(){ renderSort(); });
}

function renderSlots(opts){
  var slotsEl = document.getElementById("sq-slots");
  slotsEl.innerHTML = "";
  sqSelected.forEach(function(idx, pos){
    var el = document.createElement("div");
    el.className = "slot-item"; el.textContent = opts[idx];
    el.addEventListener("click", function(){
      if(sqLocked) return;
      sqSelected.splice(pos, 1);
      var optEl = sortEl.querySelector('.sq-opt[data-optidx="' + idx + '"]');
      if(optEl) optEl.classList.remove("used");
      renderSlots(opts);
    });
    slotsEl.appendChild(el);
  });
}

function checkSort(q){
  if(sqSelected.length < q.opts.length){ alert("まだ " + (q.opts.length - sqSelected.length) + " 个选项没放"); return; }
  sqLocked = true;
  var isOk = true;
  for(var i=0; i<q.answer.length; i++){
    if(sqSelected[i] !== q.answer[i]){ isOk=false; break; }
  }
  var resEl = document.getElementById("sq-result");
  var h = "";
  if(isOk){
    h += "<div class='sq-result-head ok'>✓ 正解！</div>";
    h += "<div class='sq-correct'>" + q.correct + "</div>";
  } else {
    h += "<div class='sq-result-head ng'>✗ 不正解</div>";
    h += "<div class='sq-correct'><b>正确顺序：</b>" + q.correct + "</div>";
    h += "<div class='sq-grammar'><div class='sq-grammar-title'>涉及接续规则：</div>";
    q.grammar.forEach(function(g){
      var catLabel = "";
      GRAMDATA.forEach(function(c){ if(c.id===g.catId) catLabel=c.short; });
      h += "<div class='sq-rule'>" + g.rule;
      h += "<br><span class='sq-rule-link' data-catid='" + g.catId + "'>→ 查看「" + catLabel + "」接续表</span>";
      h += "</div>";
    });
    h += "</div>";
  }
  resEl.innerHTML = h;
  resEl.classList.add("show");
  resEl.querySelectorAll(".sq-rule-link").forEach(function(lnk){
    lnk.addEventListener("click", function(){
      showList(lnk.dataset.catid, lnk.dataset.catid);
    });
  });
}
/* init */
showList(GRAMDATA[0].id);
</script>
